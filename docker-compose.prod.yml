# Malina — production: the server serves both the game (/) and the API (/api, /ws, /game), Caddy in front gives HTTPS.
# No registry: Ansible builds the images on the developer machine, copies them over ssh and `docker load`s them,
# then puts this file, deploy/caddy/Caddyfile and .env into /opt/malina (deploy/ansible/playbooks/deploy.yml).
# By hand, from a directory with the same layout:
#   MALINA_TAG=<git sha> MALINA_DOMAIN=game.example.com ACME_EMAIL=me@example.com COMPOSE_PROFILES=caddy \
#     docker compose -f docker-compose.prod.yml up -d
# Without Caddy (own proxy in front): leave COMPOSE_PROFILES empty and proxy to MALINA_BIND:MALINA_PORT.
name: malina

services:
  malina:
    image: "${MALINA_IMAGE:-malina}:${MALINA_TAG:-local}"
    # images come from `docker load` (deploy/ansible/playbooks/push.yml), never from a registry
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DB_PATH: /data/malina.db
      STATIC: dist
    # only on the host's loopback by default: the outside world comes through Caddy
    ports:
      - "${MALINA_BIND:-127.0.0.1}:${MALINA_PORT:-8787}:8787"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: "${CADDY_IMAGE:-caddy:2.10.2-alpine}"
    pull_policy: never
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      malina:
        condition: service_healthy
    environment:
      MALINA_DOMAIN: "${MALINA_DOMAIN:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      # a directory, not the file: Ansible replaces the file, a single-file mount would keep the old one
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  # SQLite (WAL) lives here; it survives image updates and `docker compose down` (but not `down -v`)
  data:
  # Caddy certificates and ACME account — losing them means re-issuing (Let's Encrypt has rate limits)
  caddy_data:
  caddy_config:
