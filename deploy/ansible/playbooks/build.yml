# Build the image with docker buildx on this machine and push it to the registry.
#   ansible-playbook playbooks/build.yml
#   ansible-playbook playbooks/build.yml -e '{"malina_platforms": ["linux/amd64"]}'
# Needs: docker with buildx, `docker login <registry>` done on this machine.
- name: Build and push the Malina image
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ (playbook_dir ~ '/../../..') | realpath }}"
    tags_list: "{{ [malina_image ~ ':' ~ malina_tag] + ([malina_image ~ ':latest'] if malina_push_latest | bool else []) }}"
  tasks:
    - name: Refuse to push an image of uncommitted code under :latest
      ansible.builtin.assert:
        that: not (malina_tag is search('-dirty$') and malina_push_latest | bool)
        fail_msg: >-
          The working copy has uncommitted changes (tag {{ malina_tag }}). Commit them,
          or build anyway with -e malina_push_latest=false.

    - name: Check docker buildx
      ansible.builtin.command: docker buildx version
      changed_when: false
      check_mode: false

    - name: Look for the buildx builder
      ansible.builtin.command: docker buildx inspect {{ malina_buildx_builder }}
      register: builder
      changed_when: false
      check_mode: false
      failed_when: false

    # the default "docker" driver cannot build several platforms at once — a docker-container builder can
    - name: Create the buildx builder (docker-container driver)
      ansible.builtin.command: docker buildx create --name {{ malina_buildx_builder }} --driver docker-container --bootstrap
      when: builder.rc != 0
      changed_when: true

    - name: Build {{ malina_platforms | join(', ') }} and push {{ tags_list | join(', ') }}
      ansible.builtin.command:
        chdir: "{{ repo_root }}"
        argv: "{{ argv }}"
      vars:
        argv: >-
          {{ ['docker', 'buildx', 'build',
              '--builder', malina_buildx_builder,
              '--platform', malina_platforms | join(','),
              '--target', 'runtime',
              '--label', 'org.opencontainers.image.revision=' ~ malina_tag,
              '--label', 'org.opencontainers.image.source=https://github.com/aablinov/malina',
              '--provenance=false',
              '--push']
             + (['--cache-from', 'type=registry,ref=' ~ malina_cache_ref,
                 '--cache-to', 'type=registry,ref=' ~ malina_cache_ref ~ ',mode=max'] if malina_cache_ref else [])
             + (tags_list | map('regex_replace', '^', '--tag=') | list)
             + ['.'] }}
      changed_when: true

    - name: Built
      ansible.builtin.debug:
        msg: "Pushed {{ tags_list | join(', ') }}. Deploy: ansible-playbook playbooks/deploy.yml -e malina_tag={{ malina_tag }}"
