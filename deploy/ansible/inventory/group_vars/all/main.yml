# ---- image
# repository in the registry (without a tag)
malina_image: ghcr.io/aablinov/malina
# tag = git commit of the working copy the playbook runs from ("-dirty" if there are uncommitted changes);
# override for a rollback: -e malina_tag=<old sha>
malina_tag: "{{ lookup('ansible.builtin.pipe', 'git -C ' ~ (playbook_dir ~ '/../../..') ~ ' describe --always --dirty --abbrev=12 --match=NO-TAGS') }}"
# also push :latest when building
malina_push_latest: true
# target platforms for buildx; one platform is faster — put only the server's one
malina_platforms: [linux/amd64, linux/arm64]
malina_buildx_builder: malina-builder
# build cache in the registry (speeds up builds on CI and other machines); empty — no registry cache
malina_cache_ref: "{{ malina_image }}:buildcache"

# ---- registry login (the server needs it for a private image; for a public one leave empty)
registry_host: "{{ malina_image.split('/')[0] }}"
registry_username: ""
# put into inventory/group_vars/all/vault.yml with ansible-vault, never in plain text
registry_password: ""

# ---- server
malina_dir: /opt/malina
# the game server port on the host; 127.0.0.1 — reachable only through Caddy (and for the health check)
malina_bind: 127.0.0.1
malina_port: 8787

# ---- Caddy (HTTPS). The domain's A/AAAA record must point at the server, ports 80 and 443 (tcp+udp) open.
malina_caddy: true
# the game's domain, e.g. malina.example.com — set it in inventory/hosts.yml for the host
malina_domain: ""
# Let's Encrypt account email: expiry warnings and problems with certificates
acme_email: ""
caddy_http_port: 80
caddy_https_port: 443
# check https://<domain>/api/health after a deploy (needs DNS already pointing at the server)
malina_check_https: true
# how long to wait for /api/health after start
malina_health_retries: 30
# remove old images after a successful deploy
malina_prune_images: true
